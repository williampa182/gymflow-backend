spring:
  application:
    name: gymflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/gymflow_db
    username: gymflow_user
    password: gymflow_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080
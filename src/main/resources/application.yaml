spring:
  # Carga automática de .env en local — sin esto, .env.example era solo
  # documentación: no existía ningún loader real y había que exportar cada
  # variable a mano en la terminal (ver collab/aplicado/2026-07-28-*).
  # "optional:" evita que falle si el archivo no existe (Railway/prod no lo
  # tiene, usa env vars reales de la plataforma). El sufijo [.properties]
  # es el truco documentado de Spring Boot para que trate un archivo sin
  # extensión reconocida como formato .properties (KEY=VALUE), que es
  # exactamente el formato de .env. Nativo desde Spring Boot 2.4, cero
  # dependencias nuevas.
  config:
    import: "optional:file:.env[.properties]"
  application:
    name: gymflow-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gymflow_db}
    username: ${DB_USER:gymflow_user}
    password: ${DB_PASSWORD:gymflow_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # En local (default) Hibernate ajusta el esquema automáticamente, cómodo
      # para desarrollo. En producción (Railway) se debe fijar DDL_AUTO=validate
      # para que Hibernate NUNCA modifique el esquema solo, y usar migraciones
      # controladas (Flyway/Liquibase) para cualquier cambio real.
      ddl-auto: ${DDL_AUTO:update}
    # Fix security-deep-dive §5 (GLM-5.2): default cambiado de true a false.
    # show-sql loguea cada query con parámetros reales (emails, hashes) a
    # stdout; en Railway esos logs se persisten. Setear SHOW_SQL=true solo
    # en dev local si se necesita depurar queries.
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Hallazgo 1.1 del THREAT_MODEL.md. Debe coincidir con REDIS_PASSWORD
      # usado en docker-compose.yml para el contenedor de Redis.
      password: ${REDIS_PASSWORD:gymflow_redis_dev_only_change_me}

  # spring.cache.type: redis removido (hallazgo 1.2 del THREAT_MODEL.md,
  # hardening preventivo). No hay ningún @Cacheable activo en el proyecto
  # desde que se sacó de PlanService al agregar paginación (3.3) — mantener
  # el cache manager configurado sin uso era superficie muerta que alguien
  # podría reactivar sin revisar el modelo de seguridad del serializer.
  # Redis se sigue usando igual para LoginRateLimitFilter (StringRedisTemplate).

server:
  port: ${SERVER_PORT:8080}
  # Hallazgo 3.4 del THREAT_MODEL.md: antes no había ningún límite explícito
  # de tamaño de headers/body. Esto fija defaults razonables, configurables
  # por env var. OJO: max-http-form-post-size/max-swallow-size cubren
  # form-posts y el manejo de Tomcat ante cortes, pero NO limitan de forma
  # estricta un body JSON grande antes de que Spring/Jackson lo empiece a
  # leer — si se necesita un límite duro para application/json específicamente,
  # hace falta un filtro dedicado que corte por Content-Length/bytes reales.
  max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE:8KB}
  # Hallazgo 2.2 del THREAT_MODEL.md: LoginRateLimitFilter confiaba en
  # X-Forwarded-For tal cual llegaba (primer elemento), sin validar que el
  # request viniera realmente del proxy de Railway — un atacante podía
  # mandar directo ese header y rotar la IP "vista" para evadir el rate
  # limit. RemoteIpValve (activado acá vía forward-headers-strategy:
  # native) resuelve la IP real leyendo X-Forwarded-For de derecha a
  # izquierda, descartando los saltos que matcheen internal-proxies, hasta
  # encontrar el primer valor no interno. Esto es más robusto que asumir
  # una posición fija: Railway agrega (no reemplaza) la IP real al final de
  # la lista, y el propio soporte de Railway indica que el hop count no
  # está garantizado como estable — ver
  # collab/propuestas/2026-07-24-propuesta-fix-threat-model-2.2-v2-tomcat-native.md
  # para el research y la matriz de escenarios verificada.
  # Rangos cubiertos: 10.0.0.0/8 (privada), 100.64.0.0/10 (CGNAT, red mesh
  # de Railway), 172.16.0.0/12 (docker/containers), 127.0.0.0/8 y loopback
  # IPv6 (proxy local).
  # OJO: este regex NO se envuelve en ${VAR:default} — los cuantificadores
  # {1,3} del regex usan llaves sueltas (sin $) que el resolver de
  # placeholders de Spring no distingue de las del propio placeholder,
  # cortando la sustitución en la primera "}" que encuentra. Si algún día
  # hace falta hacerlo configurable, hay que hacerlo vía un profile/archivo
  # de properties separado, no con ${ENV:default} inline.
  forward-headers-strategy: native
  tomcat:
    max-http-form-post-size: ${MAX_HTTP_FORM_POST_SIZE:2MB}
    max-swallow-size: ${MAX_SWALLOW_SIZE:2MB}
    remote-ip-header: X-Forwarded-For
    protocol-header: X-Forwarded-Proto
    internal-proxies: >-
      10\.\d{1,3}\.\d{1,3}\.\d{1,3}|100\.(6[4-9]|[7-9]\d|1[0-1]\d|12[0-7])\.\d{1,3}\.\d{1,3}|172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1
  # Hallazgo 3.6 del THREAT_MODEL.md: sin esto, un stack trace completo o la
  # Whitelabel Error Page podían quedar expuestos si el perfil prod no
  # estaba bien seteado — esto lo hace explícito independientemente del
  # perfil activo, en vez de depender solo de defaults de Spring Boot.
  # server-header vacío evita que Tomcat identifique versión/stack en el
  # header Server (aunque Railway puede agregar sus propios headers fuera
  # del control de la app, eso no lo cubre esto).
  server-header: ""
  error:
    whitelabel:
      enabled: false
    include-stacktrace: ${ERROR_INCLUDE_STACKTRACE:never}
    include-message: ${ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${ERROR_INCLUDE_BINDING_ERRORS:never}

management:
  endpoints:
    web:
      exposure:
        # health e info son públicos (usados por Railway/health checks y el
        # dashboard); prometheus y el resto quedan detrás de ADMIN via
        # SecurityConfig. metrics es útil en dev, se puede restringir después.
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: GymFlow Backend
    description: API de gestión de gimnasios - planes, suscripciones y usuarios
  java:
    version: ${java.version:21}

# Fix security-deep-dive §2 (GLM-5.2): Swagger UI + /v3/api-docs quedaban
# accesibles sin restricción (permitAll en SecurityConfig), exponiendo toda
# la superficie de la API (endpoints, DTOs, validaciones) a cualquiera sin
# autenticación. Default ahora es false; setear SWAGGER_ENABLED=true solo
# en dev/staging donde se necesite la UI.
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

app:
  jwt:
    # Valor por defecto SOLO para desarrollo local. En producción (Railway,
    # etc.) esta variable DEBE definirse con un secret nuevo y único, generado
    # con: openssl rand -base64 64
    # El secret original hardcodeado quedó expuesto en el historial de Git
    # (commits previos a esta configuración) y nunca debe reutilizarse en un
    # entorno real, aunque el historial se limpie después.
    secret: ${JWT_SECRET:dev-only-a8f3c91e2b7d4f60193a5c8e7b2d4f019a3c6e8b1d5f7a90c2e4b6d8f0a1c3e5}
    expiration: ${JWT_EXPIRATION:86400000}
    # Fix security-deep-dive §4 (GLM-5.2): Opción C de la propuesta.
    # Controla si AuthResponse incluye el token JWT en el JSON de respuesta de login/register.
    # Default true mantiene el comportamiento actual intacto. Setear false cuando se use cookie httpOnly exclusivamente.
    include-token-in-response: ${JWT_INCLUDE_TOKEN_IN_RESPONSE:true}
  security:
    # Fix A (user-enumeration-3.1.md). Decisión: default false.
    # Razón: ver collab/aplicado/2026-07-16-decision-reveal-email-false.md.
    # Resumen: Fix B blindó el login contra enumeración por timing; dejar
    # registro en modo reveal=true abriría el mismo vector por /register,
    # anulando el hardening de Fix B. Default false = mensaje genérico.
    # Setear REVEAL_EMAIL_EXISTS=true solo si el contexto del despliegue
    # justifica priorizar UX sobre consistencia del threat model.
    reveal-email-exists-on-register: ${REVEAL_EMAIL_EXISTS:false}

  debug-headers:
    enabled: ${APP_DEBUG_HEADERS_ENABLED:false}

  # Feature 1 del portafolio (chatbot de soporte, ver
  # collab/propuestas/claude/features-portafolio.md). Placeholder de
  # desarrollo SOLO válido para que el ApplicationContext levante en tests
  # (este proyecto no tiene application-test.yaml ni perfil global de test,
  # así que todo @SpringBootTest depende de que cada property tenga un
  # default acá). No es una key real: cualquier llamada real con este valor
  # devuelve 401/403, mapeado a 503 por GlobalExceptionHandler.
  # En producción DEBE definirse la variable de la API key real del
  # proveedor activo.
  chat:
    # anthropic | gemini. Gemini por ahora (2026-07-26, decisión de
    # William): tier gratis real, sin tarjeta, mientras el proyecto no
    # genera ingresos. Cambiar a "anthropic" es solo esta property — el
    # código de ambos adaptadores ya está listo (ver client/).
    provider: ${APP_CHAT_PROVIDER:gemini}
    anthropic-api-key: ${ANTHROPIC_API_KEY:dev-only-placeholder-not-a-real-key}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    # Haiku 4.5: modelo más barato/rápido de la generación actual, apropiado
    # para respuestas cortas ancladas a un contexto ya armado (RAG simple),
    # no para razonamiento complejo.
    model: ${ANTHROPIC_CHAT_MODEL:claude-haiku-4-5-20251001}
    max-tokens: ${ANTHROPIC_CHAT_MAX_TOKENS:512}
    # Gemini (proveedor activo por defecto, ver "provider" arriba).
    # Placeholder de dev igual que anthropic-api-key: no es una key real.
    gemini-api-key: ${GEMINI_API_KEY:dev-only-placeholder-not-a-real-key}
    base-url-gemini: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}
    # Flash-Lite: el más económico dentro del tier gratis de Gemini.
    # Suficiente para respuestas cortas ancladas a contexto ya armado.
    model-gemini: ${GEMINI_CHAT_MODEL:gemini-3.1-flash-lite}

  # Notificaciones de vencimiento de suscripción vía Resend (ver
  # collab/propuestas/opencode/deepseek-v4-flash-free/2026-07-31-notificaciones-vencimiento-resend.md).
  # Resend se integra por HTTP directo con RestClient (patrón client/, cero
  # dependencias nuevas) — la key de dev es un placeholder igual que las del
  # chat: cualquier llamada real con ese valor devuelve 401/403, mapeado a
  # EmailEnvioException.
  email:
    resend-api-key: ${RESEND_API_KEY:dev-only-placeholder-not-a-real-key}
    resend-base-url: ${RESEND_BASE_URL:https://api.resend.com}
    # Remitente del email: en producción debe ser un dominio verificado en la
    # cuenta de Resend (ej. "GymFlow <no-reply@midominio.com>").
    from: ${EMAIL_FROM:no-reply@gymflow.com}
    # Días de anticipación con los que se avisa el vencimiento (ventana
    # abierta hoy..hoy+ventana, con tracking por notificado_en).
    aviso-ventana-dias: ${EMAIL_AVISO_VENTANA_DIAS:7}
    # Base URL pública del frontend para el CTA "Renovar ahora" — debe
    # coincidir con NEXT_PUBLIC_APP_ORIGIN del frontend. El CTA completo se
    # arma en NotificacionVencimientoService como base + /dashboard/suscripciones.
    cta-base-url: ${EMAIL_CTA_BASE_URL:http://localhost:3000}
    # Apaga el job programado (los tests @SpringBootTest lo fijan en false
    # para que no corra scheduling).
    aviso-enabled: ${EMAIL_AVISO_ENABLED:true}
    # Cron del job diario (default: 09:00 hora local del servidor).
    aviso-cron: "${EMAIL_AVISO_CRON:0 0 9 * * *}"

logging:
  level:
    # En local, TRACE ayuda a depurar el filtro JWT/auth. En producción fijar
    # SECURITY_LOG_LEVEL=WARN para no filtrar detalles de autenticación en logs.
    "[org.springframework.security]": ${SECURITY_LOG_LEVEL:TRACE}
  pattern:
    # Usado solo por el appender de consola en modo texto plano (perfil dev).
    # El perfil prod usa JSON estructurado vía logback-spring.xml.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n"
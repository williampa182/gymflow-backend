spring:
  application:
    name: gymflow-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gymflow_db}
    username: ${DB_USER:gymflow_user}
    password: ${DB_PASSWORD:gymflow_pass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # En local (default) Hibernate ajusta el esquema automáticamente, cómodo
      # para desarrollo. En producción (Railway) se debe fijar DDL_AUTO=validate
      # para que Hibernate NUNCA modifique el esquema solo, y usar migraciones
      # controladas (Flyway/Liquibase) para cualquier cambio real.
      ddl-auto: ${DDL_AUTO:update}
    # Fix security-deep-dive §5 (GLM-5.2): default cambiado de true a false.
    # show-sql loguea cada query con parámetros reales (emails, hashes) a
    # stdout; en Railway esos logs se persisten. Setear SHOW_SQL=true solo
    # en dev local si se necesita depurar queries.
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Hallazgo 1.1 del THREAT_MODEL.md. Debe coincidir con REDIS_PASSWORD
      # usado en docker-compose.yml para el contenedor de Redis.
      password: ${REDIS_PASSWORD:gymflow_redis_dev_only_change_me}

  # spring.cache.type: redis removido (hallazgo 1.2 del THREAT_MODEL.md,
  # hardening preventivo). No hay ningún @Cacheable activo en el proyecto
  # desde que se sacó de PlanService al agregar paginación (3.3) — mantener
  # el cache manager configurado sin uso era superficie muerta que alguien
  # podría reactivar sin revisar el modelo de seguridad del serializer.
  # Redis se sigue usando igual para LoginRateLimitFilter (StringRedisTemplate).

server:
  port: ${SERVER_PORT:8080}
  # Hallazgo 3.4 del THREAT_MODEL.md: antes no había ningún límite explícito
  # de tamaño de headers/body. Esto fija defaults razonables, configurables
  # por env var. OJO: max-http-form-post-size/max-swallow-size cubren
  # form-posts y el manejo de Tomcat ante cortes, pero NO limitan de forma
  # estricta un body JSON grande antes de que Spring/Jackson lo empiece a
  # leer — si se necesita un límite duro para application/json específicamente,
  # hace falta un filtro dedicado que corte por Content-Length/bytes reales.
  max-http-request-header-size: ${MAX_HTTP_REQUEST_HEADER_SIZE:8KB}
  tomcat:
    max-http-form-post-size: ${MAX_HTTP_FORM_POST_SIZE:2MB}
    max-swallow-size: ${MAX_SWALLOW_SIZE:2MB}
  # Hallazgo 3.6 del THREAT_MODEL.md: sin esto, un stack trace completo o la
  # Whitelabel Error Page podían quedar expuestos si el perfil prod no
  # estaba bien seteado — esto lo hace explícito independientemente del
  # perfil activo, en vez de depender solo de defaults de Spring Boot.
  # server-header vacío evita que Tomcat identifique versión/stack en el
  # header Server (aunque Railway puede agregar sus propios headers fuera
  # del control de la app, eso no lo cubre esto).
  server-header: ""
  error:
    whitelabel:
      enabled: false
    include-stacktrace: ${ERROR_INCLUDE_STACKTRACE:never}
    include-message: ${ERROR_INCLUDE_MESSAGE:never}
    include-binding-errors: ${ERROR_INCLUDE_BINDING_ERRORS:never}

management:
  endpoints:
    web:
      exposure:
        # health e info son públicos (usados por Railway/health checks y el
        # dashboard); prometheus y el resto quedan detrás de ADMIN via
        # SecurityConfig. metrics es útil en dev, se puede restringir después.
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: ${HEALTH_SHOW_DETAILS:when-authorized}
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: GymFlow Backend
    description: API de gestión de gimnasios - planes, suscripciones y usuarios
  java:
    version: ${java.version:21}

# Fix security-deep-dive §2 (GLM-5.2): Swagger UI + /v3/api-docs quedaban
# accesibles sin restricción (permitAll en SecurityConfig), exponiendo toda
# la superficie de la API (endpoints, DTOs, validaciones) a cualquiera sin
# autenticación. Default ahora es false; setear SWAGGER_ENABLED=true solo
# en dev/staging donde se necesite la UI.
springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

app:
  jwt:
    # Valor por defecto SOLO para desarrollo local. En producción (Railway,
    # etc.) esta variable DEBE definirse con un secret nuevo y único, generado
    # con: openssl rand -base64 64
    # El secret original hardcodeado quedó expuesto en el historial de Git
    # (commits previos a esta configuración) y nunca debe reutilizarse en un
    # entorno real, aunque el historial se limpie después.
    secret: ${JWT_SECRET:dev-only-a8f3c91e2b7d4f60193a5c8e7b2d4f019a3c6e8b1d5f7a90c2e4b6d8f0a1c3e5}
    expiration: ${JWT_EXPIRATION:86400000}
  security:
    # Fix A (user-enumeration-3.1.md). Decisión: default false.
    # Razón: ver collab/aplicado/2026-07-16-decision-reveal-email-false.md.
    # Resumen: Fix B blindó el login contra enumeración por timing; dejar
    # registro en modo reveal=true abriría el mismo vector por /register,
    # anulando el hardening de Fix B. Default false = mensaje genérico.
    # Setear REVEAL_EMAIL_EXISTS=true solo si el contexto del despliegue
    # justifica priorizar UX sobre consistencia del threat model.
    reveal-email-exists-on-register: ${REVEAL_EMAIL_EXISTS:false}

logging:
  level:
    # En local, TRACE ayuda a depurar el filtro JWT/auth. En producción fijar
    # SECURITY_LOG_LEVEL=WARN para no filtrar detalles de autenticación en logs.
    "[org.springframework.security]": ${SECURITY_LOG_LEVEL:TRACE}
  pattern:
    # Usado solo por el appender de consola en modo texto plano (perfil dev).
    # El perfil prod usa JSON estructurado vía logback-spring.xml.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{correlationId}] %logger{36} - %msg%n"
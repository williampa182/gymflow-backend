name: Backend CI

# Seguridad: solo se dispara en push/PR a main, nunca en pull_request_target
# (evita ejecutar código de forks no confiables con permisos elevados).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Principio de mínimo privilegio: el GITHUB_TOKEN solo puede leer el repo.
# No se necesita escritura porque este workflow no hace commits ni publica nada.
permissions:
  contents: read

# Cancela ejecuciones anteriores del mismo PR/branch si llega un push nuevo,
# para no gastar minutos de CI en runs obsoletos.
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compilar y correr tests
    runs-on: ubuntu-latest

    # Bug encontrado el 2026-07-26: varios tests son @SpringBootTest y
    # necesitan un contexto completo con Postgres/Redis reales (DTO mass
    # assignment, regresión de privilege escalation, JWT malformado, header
    # de diagnóstico). El comentario viejo de este workflow decía "Mockito
    # puro, sin Docker" — cierto cuando se escribió, desactualizado desde que
    # se agregaron esos tests. Sin este bloque, CI fallaba silenciosamente
    # con "Connection to localhost:5432 refused" en todos ellos.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: gymflow_db
          POSTGRES_USER: gymflow_user
          POSTGRES_PASSWORD: gymflow_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # La imagen oficial de redis no soporta requirepass via env var (a
      # diferencia de postgres). En CI corre sin auth — riesgo aceptable:
      # contenedor efímero, sin exposición fuera del runner. REDIS_PASSWORD
      # se pisa a vacío más abajo para que el cliente no mande AUTH contra
      # un servidor que no lo pide.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Actions oficiales de la organización "actions" (mantenidas por GitHub,
      # badge de Verified creator). Pineadas a versión mayor; Dependabot
      # (ver .github/dependabot.yml) avisa/actualiza automáticamente.
      - name: Checkout del repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21 (Temurin)
        uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Dar permisos de ejecución a mvnw
        # El bit +x se pierde al hacer commit desde Windows; el runner es
        # Linux y necesita el permiso explícito para ejecutar el script.
        run: chmod +x ./mvnw

      - name: Compilar y correr tests
        # Variables coherentes con .env.example / docker-compose.yml. Los
        # tests puramente Mockito no las necesitan pero no interfieren; los
        # @SpringBootTest sí las requieren para levantar el contexto.
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: gymflow_db
          DB_USER: gymflow_user
          DB_PASSWORD: gymflow_pass
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
        run: ./mvnw -B test
